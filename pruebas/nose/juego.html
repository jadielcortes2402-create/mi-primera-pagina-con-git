<style>

.status{display:flex;flex-direction:column;gap:9px;min-width:245px}.bar-block{background:rgba(5,9,17,.66);border:1px solid var(--line);border-radius:13px;padding:8px 12px 9px;backdrop-filter:blur(8px);box-shadow:0 10px 28px rgba(0,0,0,.22)}

nts:none;box-shadow:0 0 24px rgba(255,120,210,.65)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,6,12,.67);backdrop-filter:blur(7px);z-index:10;transition:opacity .22s ease}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(90%,760px);max-height:92%;overflow:auto;background:linear-gradient(180deg,rgba(12,20,35,.96),rgba(7,12,22,.94));border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px;box-shadow:0 28px 90px rgba(0,0,0,.55)}

.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.shop-card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:15px;display:flex;flex-direction:column;min-height:190px;box-shadow:0 12px 28px rgba(0,0,0,.16)}.shop-icon{font-size:38px;line-height:1;margin-bottom:10px}.shop-card h3{margin:0 0 6px;font-size:16px;color:var(--text)}.shop-card p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.45;flex:1}.shop-price{font-weight:900;color:var(--accent);margin-bottom:10px}.shop-card button{width:100%;font-size:.78rem;padding:10px 12px}.shop-card button:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}.shop-badge{display:inline-block;align-self:flex-start;margin-bottom:8px;padding:4px 8px;border-radius:999px;background:rgba(93,242,168,.12);border:1px solid rgba(93,242,168,.24);color:var(--good);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.money-box .big{color:var(--good)}.combo-box .big{color:#ff79cc}.dash-ready{box-shadow:0 0 0 1px rgba(83,214,255,.16),0 0 18px rgba(83,214,255,.10)}

ne-height:1.45;box-shadow:0 10px 24px rgba(0,0,0,.2)}.boss-points-hud.show{display:block}.boss-points-hud b{color:#ffbf47}.boss-points-hud span{font-weight:900;color:#fff}

<body>
<div class="game-shell">
  <canvas id="gameCanvas" width="1100" height="680"></canvas>
  <div class="hud">
    <div class="status">
      <div class="bar-block"><div class="label-row"><span>Vida</span><span id="healthText">100/100</span></div><div class="bar"><div id="healthBar" class="bar-fill health-fill"></div></div></div>
      <div class="bar-block"><div class="label-row"><span>Resistencia</span><span id="staminaText">100/100</span></div><div class="bar"><div id="staminaBar" class="bar-fill stamina-fill"></div></div></div>
      <div id="bossStatus" class="boss-status"><strong><span id="bossMiniName">JEFE</span><span id="bossMiniText">0/300</span></strong><div class="bar"><div id="bossMiniBar" class="bar-fill boss-fill"></div></div><div id="bossAbilityText" class="boss-ability">HABILIDAD: —</div></div>
    </div>
    <div class="right-hud">
      <div class="wave-box"><span class="small">Oleada</span><span id="waveText" class="big">1</span></div>
      <div class="wave-box combo-box"><span class="small">Combo</span><span id="comboText" class="big">x0</span></div>
      <div class="score-box"><span class="small">Puntuación</span><span id="scoreText" class="big">0</span></div>
      <div class="score-box money-box"><span class="small">Dinero</span><span id="moneyText" class="big">0</span></div>
      <div class="wave-box"><span class="small">Checkpoint</span><span id="checkpointText" class="big">—</span></div><div class="ultimate-box"><div class="ultimate-label"><span>⚡ Habilidad especial</span><span id="ultimateText">L</span></div><div class="ultimate-track"><div id="ultimateFill" class="ultimate-fill"></div></div></div>
    </div>
  </div>
  <div id="bossWrap" class="boss-wrap"><div id="bossTitle" class="boss-title">⚠ JEFE DETECTADO ⚠</div><div class="bar"><div id="bossBar" class="bar-fill boss-fill"></div></div></div>
  <div id="toast" class="toast"></div>
  <div id="bossPointsHud" class="boss-points-hud">🎯 <b id="bossPointsLabel">Puntos para el jefe</b><br><span id="bossPointsText">0</span> pts · <span id="bossKillsText">0</span> enemigos</div>

  <button id="pauseGameButton" class="pause-game-btn" aria-label="Pausar partida" title="Pausar partida">Ⅱ PAUSA</button>

    <div id="menuPanel" class="panel"></div>
  </div>

<script>
// Almacenamiento seguro: en navegadores o contextos privados donde localStorage esté bloqueado,
// el juego sigue funcionando usando memoria sin romper el menú ni el renderizado.
const storage=(()=>{
  try{
    const s=window.localStorage;
    const test='__shifter_storage_test__';
    s.setItem(test,'1');
    s.removeItem(test);
    return s;
  }catch(e){
    const mem={};
    return {
      getItem:k=>Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null,
      setItem:(k,v)=>{mem[k]=String(v)},
      removeItem:k=>{delete mem[k]}
    };
  }
})();

let audioCtx=null;
let masterGain=null;
function ensureAudio(){
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      audioCtx=new AC();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=.32;
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function tone(freq1,freq2=.0,duration=.08,type='sine',volume=.05,delay=0){
  ensureAudio();
  if(!audioCtx||!masterGain)return;
  const now=audioCtx.currentTime+delay;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(Math.max(25,freq1),now);
  if(freq2)osc.frequency.exponentialRampToValueAtTime(Math.max(25,freq2),now+duration);
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),now+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  osc.connect(gain);gain.connect(masterGain);osc.start(now);osc.stop(now+duration+.02);
}
function noise(duration=.15,volume=.05,delay=0){
  ensureAudio();
  if(!audioCtx||!masterGain)return;
  const length=Math.floor(audioCtx.sampleRate*duration);
  const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
  const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
  filter.type='lowpass';filter.frequency.value=1800;
  const now=audioCtx.currentTime+delay;
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.005);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  src.buffer=buffer;src.connect(filter);filter.connect(gain);gain.connect(masterGain);src.start(now);src.stop(now+duration+.02);
}

const GLOBAL_PROGRESS_KEY='shifter_global_progress_v6';
const PORTABLE_SAVE_VERSION=7;
function buildPortableProgress(){return {version:PORTABLE_SAVE_VERSION,game:'SHIFTER',savedAt:Date.now(),highScore:Number(highScore)||0,money:Number(persistentMoney)||0,unlockedCharacters:[...new Set(unlockedCharacters)],selectedCharacter,discovered:{...discovered},ally:{unlocked:!!allyUnlocked,active:!!allyActive,selected:selectedAlly,damageLevel:Number(allyDamageLevel)||0,fireLevel:Number(allyFireLevel)||0,healthLevel:Number(allyHealthLevel)||0,intelligenceLevel:Number(allyIntelligenceLevel)||0,paralyzeReductionLevel:Number(allyParalyzeReductionLevel)||0,extraSlots:Number(allyExtraSlots)||0,editSlot:Number(allyEditSlot)||0,profiles:allyProfiles.map(p=>({...p,paralyzeTimer:0,medicSkillCharge:0,medicSkillCooldown:0}))},run:{score:Number(score)||0,worldKillsSinceBoss:Number(worldKillsSinceBoss)||0,comboCount:Number(comboCount)||0,ultimateCharge:Number(ultimateCharge)||0,medicSkillCharge:Number(medicSkillCharge)||0,medicSkillCooldown:Number(medicSkillCooldown)||0,cannonLevel:Number(cannonLevel)||0,titanSpeedLevel:Number(titanSpeedLevel)||0,enemyDensityLevel:Number(enemyDensityLevel)||0,cannonAngles:Array.isArray(cannonAngles)?[...cannonAngles]:[]},checkpoint:checkpoint?JSON.parse(JSON.stringify(checkpoint)):null};}
function saveProgressSnapshot(){try{const raw=JSON.stringify(buildPortableProgress());storage.setItem(PROGRESS_SNAPSHOT_KEY,raw);storage.setItem(GLOBAL_PROGRESS_KEY,raw)}catch(e){}}
function encodePortableSave(){const raw=JSON.stringify(buildPortableProgress());const bytes=new TextEncoder().encode(raw);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);}
function decodePortableSave(code){try{const bin=atob(String(code).trim().replace(/\s+/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch(e){return null}}
function applyPortableProgress(snap){if(!snap||snap.game!=='SHIFTER'||![1,2,3,4,5,6,7].includes(Number(snap.version)))return false;try{highScore=Math.max(highScore,Number(snap.highScore)||0);persistentMoney=Math.max(persistentMoney,Number(snap.money)||0);if(Array.isArray(snap.unlockedCharacters))unlockedCharacters=[...new Set([...unlockedCharacters,...snap.unlockedCharacters])].filter(id=>CHARACTERS[id]);if(!CHARACTERS[selectedCharacter]||!unlockedCharacters.includes(selectedCharacter))selectedCharacter=unlockedCharacters.includes(snap.selectedCharacter)?snap.selectedCharacter:'shifter';else if(snap.selectedCharacter&&CHARACTERS[snap.selectedCharacter]&&unlockedCharacters.includes(snap.selectedCharacter))selectedCharacter=snap.selectedCharacter;if(snap.discovered&&typeof snap.discovered==='object')Object.assign(discovered,snap.discovered);if(snap.ally&&typeof snap.ally==='object'){allyUnlocked=!!snap.ally.unlocked||allyUnlocked;allyActive=snap.ally.active!==false;selectedAlly=snap.ally.selected&&CHARACTERS[snap.ally.selected]&&unlockedCharacters.includes(snap.ally.selected)?snap.ally.selected:selectedAlly;allyDamageLevel=Math.max(allyDamageLevel,Number(snap.ally.damageLevel)||0);allyFireLevel=Math.max(allyFireLevel,Number(snap.ally.fireLevel)||0);allyHealthLevel=Math.max(allyHealthLevel,Number(snap.ally.healthLevel)||0);allyIntelligenceLevel=Math.max(allyIntelligenceLevel,Number(snap.ally.intelligenceLevel)||0);allyParalyzeReductionLevel=Math.max(allyParalyzeReductionLevel,Number(snap.ally.paralyzeReductionLevel)||0);allyExtraSlots=Math.max(allyExtraSlots,Math.min(2,Number(snap.ally.extraSlots)||0))}if(snap.checkpoint&&(!checkpoint||Number(snap.checkpoint.bossesDefeated||0)>Number(checkpoint.bossesDefeated||0)||Number(snap.checkpoint.score||0)>Number(checkpoint.score||0)))checkpoint=snap.checkpoint;storage.setItem(HIGH_SCORE_KEY,String(Math.floor(highScore)));storage.setItem(MONEY_KEY,String(Math.floor(persistentMoney)));storage.setItem('shifter_unlocked_characters_v1',JSON.stringify(unlockedCharacters));storage.setItem('shifter_character_v1',selectedCharacter);storage.setItem('shifter_discovered_v2',JSON.stringify(discovered));storage.setItem(ALLY_KEY,JSON.stringify({unlocked:allyUnlocked,selected:selectedAlly,active:allyActive,damageLevel:allyDamageLevel,fireLevel:allyFireLevel,healthLevel:allyHealthLevel,intelligenceLevel:allyIntelligenceLevel,paralyzeReductionLevel:allyParalyzeReductionLevel,extraSlots:allyExtraSlots}));if(checkpoint)storage.setItem(CHECKPOINT_KEY,JSON.stringify(checkpoint));saveProgressSnapshot();money=persistentMoney;activateAlly();updateHud();return true}catch(e){return false}}
function exportProgressFile(){const blob=new Blob([JSON.stringify(buildPortableProgress(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shifter_progreso.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('💾 PROGRESO EXPORTADO',1.4)}
function importProgressFile(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const snap=JSON.parse(String(reader.result));if(applyPortableProgress(snap)){showToast('✅ PROGRESO IMPORTADO',1.8);showMenu('Progreso migrado correctamente ✅')}else showToast('❌ Archivo de progreso no válido',1.8)}catch(e){showToast('❌ No se pudo importar el progreso',1.8)}};reader.readAsText(file)});input.click()}

function mergeProgressSnapshot(){
  try{
    if(typeof FRESH_START_KEY!=='undefined' && storage.getItem(FRESH_START_KEY)==='1') return;
    const raws=[storage.getItem(GLOBAL_PROGRESS_KEY),storage.getItem(PROGRESS_SNAPSHOT_KEY),storage.getItem('shifter_progress_snapshot_v1'),storage.getItem('shifter_progress_snapshot_v2'),storage.getItem('shifter_progress_snapshot_v3'),storage.getItem('shifter_progress_snapshot_v5'),storage.getItem('shifter_progress_snapshot_v6')];
    for(const raw of raws){
      if(!raw) continue;
      const snap=JSON.parse(raw);
      if(!snap||snap.game!=='SHIFTER'||![1,2,3,4,5,6,7].includes(Number(snap.version))) continue;
      highScore=Math.max(highScore,Number(snap.highScore)||0);
      persistentMoney=Math.max(persistentMoney,Number(snap.money)||0);
      if(Array.isArray(snap.unlockedCharacters)) unlockedCharacters=[...new Set([...unlockedCharacters,...snap.unlockedCharacters])].filter(id=>CHARACTERS[id]);
      if(snap.selectedCharacter&&CHARACTERS[snap.selectedCharacter]&&unlockedCharacters.includes(snap.selectedCharacter)) selectedCharacter=snap.selectedCharacter;
      if(snap.discovered&&typeof snap.discovered==='object') Object.assign(discovered,snap.discovered);
      if(snap.ally&&typeof snap.ally==='object'){
        allyUnlocked=!!snap.ally.unlocked||allyUnlocked;
        allyActive=snap.ally.active!==false;
        selectedAlly=CHARACTERS[snap.ally.selected]&&unlockedCharacters.includes(snap.ally.selected)?snap.ally.selected:selectedAlly;
        allyDamageLevel=Math.max(allyDamageLevel,Number(snap.ally.damageLevel)||0);
        allyFireLevel=Math.max(allyFireLevel,Number(snap.ally.fireLevel)||0);
        allyHealthLevel=Math.max(allyHealthLevel,Number(snap.ally.healthLevel)||0);allyIntelligenceLevel=Math.max(allyIntelligenceLevel,Number(snap.ally.intelligenceLevel)||0);allyParalyzeReductionLevel=Math.max(allyParalyzeReductionLevel,Number(snap.ally.paralyzeReductionLevel)||0);
      }
      if(snap.checkpoint&&(!checkpoint||Number(snap.checkpoint.bossesDefeated||0)>Number(checkpoint.bossesDefeated||0)||Number(snap.checkpoint.score||0)>Number(checkpoint.score||0))) checkpoint=snap.checkpoint;
      if(snap.run){
        worldKillsSinceBoss=Math.max(worldKillsSinceBoss,Number(snap.run.worldKillsSinceBoss)||0);
        comboCount=Math.max(comboCount,Number(snap.run.comboCount)||0);
        ultimateCharge=Math.max(ultimateCharge,Number(snap.run.ultimateCharge)||0);medicSkillCharge=Math.max(medicSkillCharge,Number(snap.run.medicSkillCharge)||0);medicSkillCooldown=Math.min(medicSkillCooldown,Number(snap.run.medicSkillCooldown)||0);if(Number.isFinite(Number(snap.run.cannonLevel)))cannonLevel=Math.max(cannonLevel,Number(snap.run.cannonLevel)||0);titanSpeedLevel=Math.max(titanSpeedLevel,Math.min(2,Number(snap.run.titanSpeedLevel)||0));enemyDensityLevel=Math.max(enemyDensityLevel,Math.min(3,Number(snap.run.enemyDensityLevel)||0));if(Array.isArray(snap.run.cannonAngles)&&snap.run.cannonAngles.length)cannonAngles=[...snap.run.cannonAngles];ensureCannonAngles();
      }
    }
    storage.setItem(HIGH_SCORE_KEY,String(Math.floor(highScore)));
    storage.setItem(MONEY_KEY,String(Math.floor(persistentMoney)));
    storage.setItem('shifter_unlocked_characters_v1',JSON.stringify(unlockedCharacters));
    storage.setItem('shifter_character_v1',selectedCharacter);
    storage.setItem('shifter_discovered_v2',JSON.stringify(discovered));
    if(checkpoint) storage.setItem(CHECKPOINT_KEY,JSON.stringify(checkpoint));
    saveAlly();
    saveProgressSnapshot();
  }catch(e){}
}

// Migración automática desde versiones antiguas de Shifter.
// No elimina nada: toma el mejor progreso encontrado y lo combina con el actual.
function migrateLegacyProgress(){
  try{
    if(typeof FRESH_START_KEY!=='undefined' && storage.getItem(FRESH_START_KEY)==='1') return;
    const legacyKeys={
      highScore:['shifter_high_score','shifter_highscore','highScore'],
      money:['shifter_money','shifter_coins','money'],
      checkpoint:['shifter_checkpoint','shifter_checkpoint_v1','shifter_checkpoint_v2'],
      characters:['shifter_unlocked_characters','shifter_characters','unlockedCharacters'],
      selected:['shifter_character','selectedCharacter'],
      discovered:['shifter_discovered','shifter_discovered_v1','shifter_enemy_index'],
      ally:['shifter_ally','shifter_helper','allySave']
    };
    const getAny=(keys)=>{for(const k of keys){const v=storage.getItem(k);if(v!==null&&v!=='')return v}return null};
    const n=v=>Number(v)||0;
    highScore=Math.max(highScore,n(getAny(legacyKeys.highScore)));
    persistentMoney=Math.max(persistentMoney,n(getAny(legacyKeys.money)));
    const cpRaw=getAny(legacyKeys.checkpoint);
    if(cpRaw){try{const cp=JSON.parse(cpRaw);if(cp&&typeof cp==='object' && (!checkpoint || n(cp.bossesDefeated)>n(checkpoint.bossesDefeated) || n(cp.score)>n(checkpoint.score))) checkpoint=cp}catch(e){}}
    const charsRaw=getAny(legacyKeys.characters);
    if(charsRaw){try{const chars=JSON.parse(charsRaw);if(Array.isArray(chars)) unlockedCharacters=[...new Set([...unlockedCharacters,...chars])].filter(id=>CHARACTERS[id])}catch(e){}}
    const sel=getAny(legacyKeys.selected);
    if(sel&&CHARACTERS[sel]&&unlockedCharacters.includes(sel)) selectedCharacter=sel;
    const discRaw=getAny(legacyKeys.discovered);
    if(discRaw){try{const d=JSON.parse(discRaw);if(d&&typeof d==='object')Object.assign(discovered,d)}catch(e){}}
    const allyRaw=getAny(legacyKeys.ally);
    if(allyRaw){try{const a=JSON.parse(allyRaw);if(a&&typeof a==='object'){
      allyUnlocked=!!a.unlocked||allyUnlocked;
      allyActive=a.active!==false;
      if(a.selected&&CHARACTERS[a.selected]&&unlockedCharacters.includes(a.selected)) selectedAlly=a.selected;
      allyDamageLevel=Math.max(allyDamageLevel,n(a.damageLevel));
      allyFireLevel=Math.max(allyFireLevel,n(a.fireLevel));
      allyHealthLevel=Math.max(allyHealthLevel,n(a.healthLevel));
    }}catch(e){}}
    // También recupera cualquier snapshot histórico conocido.
    const snapshotKeys=['shifter_progress_snapshot_v1','shifter_progress_snapshot_v2','shifter_progress_snapshot_v3','shifter_progress_snapshot_v4','shifter_progress_snapshot_v5','shifter_progress_snapshot_v6','shifter_global_progress_v1','shifter_global_progress_v2','shifter_global_progress_v3','shifter_global_progress_v4','shifter_global_progress_v5'];
    for(const k of snapshotKeys){
      const raw=storage.getItem(k); if(!raw) continue;
      try{
        const snap=JSON.parse(raw); if(!snap||snap.game!=='SHIFTER') continue;
        highScore=Math.max(highScore,n(snap.highScore)); persistentMoney=Math.max(persistentMoney,n(snap.money));
        if(Array.isArray(snap.unlockedCharacters)) unlockedCharacters=[...new Set([...unlockedCharacters,...snap.unlockedCharacters])].filter(id=>CHARACTERS[id]);
        if(snap.selectedCharacter&&CHARACTERS[snap.selectedCharacter]&&unlockedCharacters.includes(snap.selectedCharacter)) selectedCharacter=snap.selectedCharacter;
        if(snap.discovered&&typeof snap.discovered==='object') Object.assign(discovered,snap.discovered);
        if(snap.checkpoint&&(!checkpoint||n(snap.checkpoint.bossesDefeated)>n(checkpoint.bossesDefeated)||n(snap.checkpoint.score)>n(checkpoint.score))) checkpoint=snap.checkpoint;
        if(snap.ally&&typeof snap.ally==='object'){
          allyUnlocked=!!snap.ally.unlocked||allyUnlocked; allyActive=snap.ally.active!==false;
          if(snap.ally.selected&&CHARACTERS[snap.ally.selected]&&unlockedCharacters.includes(snap.ally.selected)) selectedAlly=snap.ally.selected;
          allyDamageLevel=Math.max(allyDamageLevel,n(snap.ally.damageLevel)); allyFireLevel=Math.max(allyFireLevel,n(snap.ally.fireLevel)); allyHealthLevel=Math.max(allyHealthLevel,n(snap.ally.healthLevel)); allyIntelligenceLevel=Math.max(allyIntelligenceLevel,n(snap.ally.intelligenceLevel)); allyParalyzeReductionLevel=Math.max(allyParalyzeReductionLevel,n(snap.ally.paralyzeReductionLevel));allyExtraSlots=Math.max(allyExtraSlots,Math.min(2,n(snap.ally.extraSlots)));
        }
      }catch(e){}
    }
    // Sincroniza las claves actuales y guarda el resultado combinado.
    storage.setItem(HIGH_SCORE_KEY,String(Math.floor(highScore)));
    storage.setItem(MONEY_KEY,String(Math.floor(persistentMoney)));
    storage.setItem('shifter_unlocked_characters_v1',JSON.stringify(unlockedCharacters));
    storage.setItem('shifter_character_v1',selectedCharacter);
    storage.setItem('shifter_discovered_v2',JSON.stringify(discovered));
    if(checkpoint) storage.setItem(CHECKPOINT_KEY,JSON.stringify(checkpoint));
    saveAlly();
    saveProgressSnapshot();
    if(checkpoint || highScore>0 || persistentMoney>0 || unlockedCharacters.length>1 || Object.keys(discovered).length) showToast('✅ PROGRESO ANTIGUO RECUPERADO',2.2);
  }catch(e){}
}

function renderShop(){
  const panel=menuPanel;
  // Captura SIEMPRE la posición actual real de ambos posibles scrolls antes de reconstruir la tienda.
  const currentInner=panel.querySelector('.index-panel');
  const savedInnerTop=Math.max(0,Number(currentInner?.scrollTop)||Number(shopScrollTop)||0);
  const savedInnerLeft=Math.max(0,Number(currentInner?.scrollLeft)||Number(shopScrollLeft)||0);
  const savedOuterTop=Math.max(0,Number(panel.scrollTop)||Number(shopOuterScrollTop)||0);
  const savedOuterLeft=Math.max(0,Number(panel.scrollLeft)||Number(shopOuterScrollLeft)||0);
  const scrollLockUntil=performance.now()+1200;
  shopScrollLockY=savedInnerTop;
  shopScrollLockUntil=scrollLockUntil;
  try{if(document.activeElement&&panel.contains(document.activeElement))document.activeElement.blur()}catch(e){}
  panel.innerHTML=shopTemplate();
  shopScroller=panel.querySelector('.index-panel');
  const restoreScroll=()=>{
    // Evita que el navegador haga scroll automático al reconstruir botones.
    panel.style.scrollBehavior='auto';
    panel.scrollTop=savedOuterTop;
    panel.scrollLeft=savedOuterLeft;
    if(shopScroller){
      shopScroller.style.scrollBehavior='auto';
      shopScroller.scrollTop=savedInnerTop;
      shopScroller.scrollLeft=savedInnerLeft;
      shopScrollTop=shopScroller.scrollTop;
      shopScrollLeft=shopScroller.scrollLeft;
    }
    shopOuterScrollTop=panel.scrollTop;
    shopOuterScrollLeft=panel.scrollLeft;
  };
  restoreScroll();
  requestAnimationFrame(restoreScroll);
  setTimeout(restoreScroll,0);
  setTimeout(restoreScroll,50);
  setTimeout(restoreScroll,150);
  setTimeout(restoreScroll,300);
  setTimeout(restoreScroll,600);
  setTimeout(restoreScroll,900);
  setTimeout(restoreScroll,1200);
  if(shopScroller){
    shopScroller.onscroll=()=>{if(performance.now()<shopScrollLockUntil){if(Math.abs(shopScroller.scrollTop-shopScrollLockY)>1)shopScroller.scrollTop=shopScrollLockY;shopScrollTop=shopScrollLockY}else{shopScrollTop=shopScroller.scrollTop;shopScrollLeft=shopScroller.scrollLeft}};
  }
  panel.onscroll=()=>{shopOuterScrollTop=panel.scrollTop;shopOuterScrollLeft=panel.scrollLeft;if(performance.now()<shopScrollLockUntil&&shopScroller){shopScroller.scrollTop=shopScrollLockY;shopScrollTop=shopScrollLockY}};
  const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn)};
  bind('buyHealth',()=>buyUpgrade('health'));
  bind('buyStamina',()=>buyUpgrade('stamina'));
  bind('buyRegen',()=>buyUpgrade('regen'));
  bind('buyFire',()=>buyUpgrade('fire'));
  bind('buyCannon',()=>buyUpgrade('cannon'));
  bind('buyExtraAlly',buyExtraAlly);
  bind('buyEnemyDensity',buyEnemyDensity);
  bind('buyTitanSpeed',buyTitanSpeed);
  document.querySelectorAll('.shop-cannon-step').forEach(btn=>btn.addEventListener('click',()=>stepCannonFromShop(Number(btn.dataset.index),Number(btn.dataset.step))));
  document.querySelectorAll('.shop-cannon-preset').forEach(btn=>btn.addEventListener('click',()=>setCannonAngleFromShop(Number(btn.dataset.index),Number(btn.dataset.angle))));
  document.querySelectorAll('.shop-cannon-slider').forEach(sl=>sl.addEventListener('input',e=>setCannonAngleFromShop(Number(e.target.dataset.index),e.target.value)));
  bind('resetShopCannons',resetCannonAnglesFromShop);
  bind('buyHoming',()=>buyUpgrade('homing'));
  bind('toggleAlly',toggleAlly);
  document.querySelectorAll('[data-ally-slot]').forEach(btn=>btn.addEventListener('click',()=>selectAllySlot(Number(btn.dataset.allySlot))));
  document.querySelectorAll('[data-ally-character]').forEach(btn=>btn.addEventListener('click',()=>setAllyCharacter(btn.dataset.allyCharacter)));
  bind('allyDamage',()=>buyAllyUpgrade('damage'));
  bind('allyFire',()=>buyAllyUpgrade('fire'));
  bind('allyHealth',()=>buyAllyUpgrade('health'));
  bind('allyIntelligence',()=>buyAllyUpgrade('intelligence'));

function claim200kBonus(){
  try{
    const alreadyClaimed=storage.getItem(START_BONUS_CLAIMED_KEY)==='1';
    const pending=Math.max(Number(pendingStartScore)||0,Number(storage.getItem(START_BONUS_PENDING_KEY)||0));
    if(alreadyClaimed || pending>0){
      showToast('🎁 LOS 200.000 PUNTOS YA ESTÁN RECLAMADOS',1.4);
      return;
    }
    pendingStartScore=ONE_TIME_START_SCORE;
    score=Math.max(Number(score)||0,ONE_TIME_START_SCORE);
    highScore=Math.max(Number(highScore)||0,ONE_TIME_START_SCORE);
    if(checkpoint){
      checkpoint.score=Math.max(Number(checkpoint.score)||0,ONE_TIME_START_SCORE);
      try{storage.setItem(CHECKPOINT_KEY,JSON.stringify(checkpoint))}catch(e){}
    }
    storage.setItem(START_BONUS_CLAIMED_KEY,'1');
    storage.setItem(START_BONUS_PENDING_KEY,String(ONE_TIME_START_SCORE));
    saveHighScore();
    saveProgressSnapshot();
    ensureAudio();sfx.buy();
    showMenu('🎁 ¡200.000 PUNTOS RECLAMADOS! Ya están guardados y se usarán al iniciar la siguiente partida.');
  }catch(e){showToast('❌ No se pudo reclamar el bonus',1.4)}
}
function consumePendingStartScore(){
  try{
    const pending=Math.max(Number(pendingStartScore)||0,Number(storage.getItem(START_BONUS_PENDING_KEY)||0));
    if(pending<=0)return 0;
    pendingStartScore=0;
    storage.removeItem(START_BONUS_PENDING_KEY);
    // La marca de reclamado se conserva: este bonus es de un solo uso.
    return pending;

function drawPlayer(){
  // El jugador siempre se dibuja al final del gameplay y con estado de canvas limpio.
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ensureCannonAngles();
  const totalCannons=1+cannonLevel;
  const lateralStep=8;

  ctx.save();
  ctx.translate(player.x,player.y);

  for(let i=0;i<totalCannons;i++){
    const a=player.angle+cannonAngles[i];
    const side=(i-(totalCannons-1)/2)*lateralStep;
    const selected=cannonAimMode&&i===selectedCannon;

    ctx.save();
    ctx.rotate(a);
    ctx.translate(0,side);

    const barrelLength=27,barrelWidth=6;
    ctx.shadowBlur=selected?16:0;
    ctx.shadowColor=selected?'#ffe66d':'transparent';

    ctx.fillStyle=selected?'#5b4212':'#0c1727';
    ctx.fillRect(8,-barrelWidth/2,barrelLength,barrelWidth);

    ctx.fillStyle=selected?'#fff1a8':(i===Math.floor(totalCannons/2)?'#dff7ff':'#8bb7c7');
    ctx.fillRect(10,-barrelWidth/2+1,barrelLength-6,barrelWidth-2);

    ctx.fillStyle=selected?'#fff06a':'#ffd15d';
    ctx.beginPath();
    ctx.arc(8+barrelLength,0,3.2,0,Math.PI*2);
    ctx.fill();

    if(selected){
      ctx.strokeStyle='rgba(255,238,92,.95)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(8+barrelLength,0,7+Math.sin(backgroundTime*8)*1.5,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  if(specialActiveTimer>0||specialIsActive('titan')){
    const c=CHARACTERS[selectedCharacter]||CHARACTERS.shifter;
    ctx.save();
    ctx.globalAlpha=.16+.07*Math.sin(backgroundTime*8);
    ctx.strokeStyle=c.color;ctx.lineWidth=4;ctx.shadowBlur=18;ctx.shadowColor=c.color;
    ctx.beginPath();ctx.arc(0,0,player.radius+12+Math.sin(backgroundTime*6)*3,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  if(specialIsActive('titan')&&specialShieldHp>0){
    ctx.save();
    const start=player.angle-1.10,end=player.angle+1.10;
    ctx.globalAlpha=.70+.12*Math.sin(backgroundTime*9);ctx.fillStyle='rgba(105,213,255,.16)';ctx.strokeStyle='#9be7ff';ctx.lineWidth=7;ctx.shadowBlur=24;ctx.shadowColor='#62dfff';
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,58,start,end);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.globalAlpha=.95;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,49,start,end);ctx.stroke();
    ctx.fillStyle='#dffaff';ctx.font='900 10px Arial';ctx.textAlign='center';ctx.fillText(Math.ceil(specialShieldHp)+' PV',Math.cos(player.angle)*65,Math.sin(player.angle)*65-3);
    ctx.restore();
  }

  ctx.fillStyle='#4edbff';
  ctx.beginPath();
  ctx.arc(0,0,player.radius,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#dff7ff';
  ctx.beginPath();
  ctx.arc(0,-5,5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  if(cannonAimMode&&state==='playing'){
    const total=totalCannons;
    const boxW=286,boxH=50,boxX=(canvas.width-boxW)/2,boxY=16;
    ctx.save();
    ctx.fillStyle='rgba(8,12,20,.82)';
    ctx.strokeStyle='rgba(255,230,100,.60)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.roundRect(boxX,boxY,boxW,boxH,12);
    ctx.fill();ctx.stroke();

    ctx.fillStyle='#fff2a8';
    ctx.font='900 12px Arial';
    ctx.textAlign='center';
    ctx.fillText('🎯 AJUSTANDO CAÑÓN '+(selectedCannon+1)+' / '+total,canvas.width/2,boxY+19);

    ctx.fillStyle='#d8e6ff';
    ctx.font='700 10px Arial';
    ctx.fillText('Mueve el mouse · 1-9 elige · [ ] cambia · C termina',canvas.width/2,boxY+36);
    ctx.restore();
  }
}

    ctx.save();ctx.globalAlpha=1-eyeOpen;ctx.strokeStyle='#e6d2ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-23,-9);ctx.quadraticCurveTo(-16,-2,-9,-9);ctx.moveTo(9,-9);ctx.quadraticCurveTo(16,-2,23,-9);ctx.stroke();ctx.restore();
    // Ojos abriéndose
    ctx.save();ctx.globalAlpha=eyeOpen;ctx.shadowBlur=20;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-14,-10,3.6,0,Math.PI*2);ctx.arc(18,-10,3.6,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle='#2a0a31';ctx.fillRect(-18,18,36,10);ctx.fillStyle='#ff6bd8';ctx.fillRect(-12,18,24,4);
    ctx.restore();
    if(ip>=.62&&ip<1){ctx.save();ctx.globalAlpha=.18+.55*eyeOpen;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-14,-10,9+eyeOpen*7,0,Math.PI*2);ctx.arc(18,-10,9+eyeOpen*7,0,Math.PI*2);ctx.fill();ctx.restore();}
    if(ip<.62)drawEntranceLabel('☠️ DESPERTANDO...');else if(ip<1)drawEntranceLabel('👁️ ¡ABRIENDO LOS OJOS!');
  }
  ctx.restore();
}

function drawBullets(){bullets.forEach(b=>{ctx.save();const ac=b.owner==='ally';ctx.shadowBlur=ac?16:14;ctx.shadowColor=ac?'#5df2a8':'#ffd15d';ctx.fillStyle=ac?'#5df2a8':'#ffd15d';ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();ctx.restore()});enemyBullets.forEach(b=>{ctx.save();ctx.shadowBlur=16;ctx.shadowColor='#ff4bd8';ctx.fillStyle='#ff73df';ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();ctx.restore()})}
function drawPickups(){pickups.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.globalAlpha=Math.min(1,p.life);ctx.shadowBlur=18;ctx.shadowColor=p.type==='health'?'#5df2a8':'#53d6ff';ctx.fillStyle=p.type==='health'?'#5df2a8':'#53d6ff';ctx.fillRect(-7,-7,14,14);ctx.restore()})}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*1.4);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1})}
function drawAlly(){
  if(!allyUnlocked||!ally.visible||state==='menu')return;
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const p0=getAllyProfile(0),c=CHARACTERS[p0.character]||CHARACTERS.shifter;
  ctx.save();ctx.translate(ally.x,ally.y);ctx.rotate(ally.angle||0);
  const paralyzed=p0.paralyzeTimer>0,glow=paralyzed?'#c9b6ff':'#5df2a8';
  ctx.globalAlpha=paralyzed?.62:1;ctx.shadowBlur=paralyzed?26:20;ctx.shadowColor=glow;ctx.fillStyle=paralyzed?'#6d5b8f':c.color;ctx.beginPath();ctx.arc(0,0,ally.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#f4fbff';ctx.beginPath();ctx.arc(-3,-5,4.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10243a';ctx.fillRect(7,-3,19,6);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,ally.radius+3,0,Math.PI*2);ctx.stroke();
  if(paralyzed){ctx.strokeStyle='#d8c8ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(18,20);ctx.moveTo(18,-20);ctx.lineTo(-18,20);ctx.stroke()}ctx.restore();
  ctx.save();const bw=46,bh=5,hp=clamp(ally.health/Math.max(1,ally.maxHealth),0,1);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(ally.x-bw/2,ally.y-ally.radius-17,bw,bh);ctx.fillStyle=paralyzed?'#b986ff':'#5df2a8';ctx.fillRect(ally.x-bw/2,ally.y-ally.radius-17,bw*hp,bh);ctx.fillStyle='#fff';ctx.font='700 9px Arial';ctx.textAlign='center';ctx.fillText('A1 · '+(paralyzed?'PARALIZADO':(c.name||'ALIADO')),ally.x,ally.y+ally.radius+15);ctx.restore();
}

function drawExtraAllies(){if(!allyUnlocked||state==='menu')return;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';for(let slot=1;slot<=2;slot++){const a=getAllyRuntime(slot),p=getAllyProfile(slot),c=CHARACTERS[p.character]||CHARACTERS.shifter;if(!a.visible)continue;const paralyzed=p.paralyzeTimer>0,glow=paralyzed?'#c9b6ff':c.color;ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle||0);ctx.globalAlpha=paralyzed?.62:1;ctx.shadowBlur=paralyzed?26:20;ctx.shadowColor=glow;ctx.fillStyle=paralyzed?'#6d5b8f':c.color;ctx.beginPath();ctx.arc(0,0,a.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f4fbff';ctx.beginPath();ctx.arc(-3,-5,4.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10243a';ctx.fillRect(7,-3,19,6);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,a.radius+3,0,Math.PI*2);ctx.stroke();if(paralyzed){ctx.strokeStyle='#d8c8ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(18,20);ctx.moveTo(18,-20);ctx.lineTo(-18,20);ctx.stroke()}ctx.restore();ctx.save();const bw=44,bh=5,hp=clamp(a.health/Math.max(1,a.maxHealth),0,1);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(a.x-bw/2,a.y-a.radius-17,bw,bh);ctx.fillStyle=paralyzed?'#b986ff':'#5df2a8';ctx.fillRect(a.x-bw/2,a.y-a.radius-17,bw*hp,bh);ctx.fillStyle='#fff';ctx.font='700 9px Arial';ctx.textAlign='center';ctx.fillText('A'+(slot+1)+' · '+(paralyzed?'PARALIZADO':(c.name||'ALIADO')),a.x,a.y+a.radius+15);ctx.restore()}}

function drawCrosshair(){ctx.save();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;const s=11;ctx.beginPath();ctx.moveTo(mouse.x-s,mouse.y);ctx.lineTo(mouse.x+s,mouse.y);ctx.moveTo(mouse.x,mouse.y-s);ctx.lineTo(mouse.x,mouse.y+s);ctx.stroke();ctx.restore()}
function render(){drawBackground();drawBossSignatureAbilities();drawPickups();drawParticles();drawBullets();enemies.forEach(drawEnemy);drawBoss();drawAlly();drawExtraAllies();drawPlayer();if(state==='shop'){const z=shopZone();ctx.save();ctx.globalAlpha=.92;ctx.fillStyle=z.accent;ctx.font='900 13px Arial';ctx.textAlign='left';ctx.fillText(z.icon+' '+z.title,24,82);ctx.globalAlpha=.58;ctx.font='11px Arial';ctx.fillText(z.tag,24,99);ctx.restore()}else if(!boss&&state==='playing'){ctx.save();ctx.globalAlpha=.68;ctx.fillStyle='#dce8ff';ctx.font='700 11px Arial';ctx.textAlign='left';ctx.fillText(nextBossRequirementText(),24,82);ctx.restore()}if(playerSlowTimer>0){ctx.save();ctx.globalAlpha=.16+.12*Math.sin(backgroundTime*10);ctx.strokeStyle='#b66cff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y,player.radius+12+Math.sin(backgroundTime*7)*3,0,Math.PI*2);ctx.stroke();ctx.restore()}if(boss&&bossIntroTimer>0&&boss.kind==='boss1'){const p=bossIntroProgress();if(p>.78){ctx.save();ctx.globalAlpha=(p-.78)*.6;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();}}if(state==='playing')drawCrosshair()}

function gameLoop(time){const dt=Math.min((time-lastTime)/1000||0,.033);lastTime=time;update(dt);render();requestAnimationFrame(gameLoop)}

document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)||e.code==='Space')e.preventDefault();keys[k]=true;if(e.code==='Space')keys.space=true;if(k==='l')keys.l=true;
if(k==='c'&&state==='playing'){e.preventDefault();toggleCannonAim();return}
if(cannonAimMode&&state==='playing'){
  if(k>='1'&&k<='9'){selectCannon(Number(k)-1);return}
  if(e.key==='['){e.preventDefault();changeSelectedCannon(-1);return}
  if(e.key===']'){e.preventDefault();changeSelectedCannon(1);return}
}
if(k==='p'&&state==='playing'){state='paused';showPauseMenu();return}if(k==='p'&&state==='paused'){state='playing';overlay.classList.add('hidden');updateHud();return}});
if(pauseGameButton)pauseGameButton.addEventListener('click',()=>{if(state==='playing'){state='paused';showPauseMenu()}});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(e.code==='Space')keys.space=false});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*(canvas.width/r.width);mouse.y=(e.clientY-r.top)*(canvas.height/r.height);if(cannonAimMode&&state==='playing'){ensureCannonAngles();const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);cannonAngles[selectedCannon]=a-player.angle}});
canvas.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;if(!cannonAimMode)shootBullet()}});window.addEventListener('mouseup',()=>mouse.down=false);canvas.addEventListener('mouseleave',()=>mouse.down=false);
function showPauseMenu(){overlay.classList.remove('hidden');if(pauseGameButton)pauseGameButton.classList.remove('show');menuPanel.innerHTML=`<h1 style="font-size:2.4rem">⏸ Pausa</h1><p class="subtitle">La partida está pausada. Tu puntuación actual es <b style="color:#ffbf47">${formatScore(score)}</b>.</p><div class="menu-actions"><button id="resumeButton">▶ Continuar</button><button id="pauseMenuButton" class="secondary-btn">🏠 Menú principal</button></div><p class="tip">También puedes presionar P para continuar.</p>`;document.getElementById('resumeButton').addEventListener('click',()=>{state='playing';overlay.classList.add('hidden');updateHud()});document.getElementById('pauseMenuButton').addEventListener('click',()=>{saveCheckpoint();showMenu('💾 Partida guardada desde pausa')})}

// Migración automática: combina el guardado global y las versiones anteriores antes de mostrar el menú.
mergeProgressSnapshot();
migrateLegacyProgress();money=persistentMoney;saveProgressSnapshot();showMenu();showCleanBuildNotice();updateHud();window.addEventListener('beforeunload',saveProgressSnapshot);window.addEventListener('pointerdown',ensureAudio,{passive:true});
// Arranque redundante y seguro del bucle visual: evita que un aviso de almacenamiento bloquee el render del juego.
setTimeout(()=>{try{if(lastTime===0)requestAnimationFrame(gameLoop)}catch(e){console.error('SHIFTER loop start',e)}},80);
</script>
</body>
</html>
