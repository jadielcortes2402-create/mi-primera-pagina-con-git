
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recolector estelar 2D</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --panel: rgba(15, 23, 42, 0.9);
      --primary: #38bdf8;
      --accent: #facc15;
      --text: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-wrap {
      width: min(96vw, 960px);
      background: var(--panel);
      border-radius: 18px;
      padding: 12px;
      display: grid;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    .hud {
      display: flex;
      gap: 12px;
      font-weight: bold;
      align-items: center;
    }

    .badge {
      background: rgba(255,255,255,0.06);
      padding: 8px 12px;
      border-radius: 999px;
      min-width: 100px;
      text-align: center;
    }

    .overlay {
      position: relative;
      width: 100%;
      height: 480px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(2,6,23,1), rgba(10,14,25,1));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      background: transparent;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .legend {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    #bossBarWrap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 20px;
      width: 60%;
      max-width: 600px;
      display: none;
      z-index: 20;
      pointer-events: none;
    }

    #bossBar {
      height: 14px;
      background: rgba(255,255,255,0.12);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }

    #bossBarInner {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #f97316);
      transform-origin: left;
      transition: width 0.15s ease-out;
    }

    #bossLabel {
      text-align: center;
      font-weight: bold;
      margin-bottom: 6px;
      color: #fee2e2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="topbar">
      <h1>🌟 Recolector estelar 2D</h1>
      <div class="hud">
        <div class="badge">Puntos: <span id="score">0</span></div>
        <div class="badge">Vidas: <span id="lives">3</span></div>
      </div>
    </div>

    <div class="overlay">
      <canvas id="gameCanvas" tabindex="0"></canvas>

      <div id="bossBarWrap">
        <div id="bossLabel">Jefe: <span id="bossHpLabel">100</span> HP</div>
        <div id="bossBar"><div id="bossBarInner"></div></div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">Iniciar juego</button>
      <div class="legend">Mover: Flechas / WASD • Disparar: Barra espaciadora / clic • Jefe aparece a 300 puntos</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const startBtn = document.getElementById("startBtn");
    const bossBarWrap = document.getElementById("bossBarWrap");
    const bossBarInner = document.getElementById("bossBarInner");
    const bossHpLabel = document.getElementById("bossHpLabel");
    const bossLabel = document.getElementById("bossLabel");

    const keys = {};
    const stars = [];
    const enemies = [];
    const collectibles = [];
    const bullets = [];
    const enemyBullets = [];

    let player = null;
    let score = 0;
    let lives = 3;
    let gameRunning = false;
    let boss = null;
    let bossSpawned = false;
    let lastShotTime = 0;
    let shotCooldown = 220;
    let lastEnemySpawn = 0;
    let lastCollectSpawn = 0;
    let lastTime = 0;
    let msgTimeout = null;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0); // para usar coords CSS
    }

    function updateHUD() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;

      if (boss) {
        bossBarWrap.style.display = "block";
        const pct = Math.max(0, boss.hp / boss.maxHp);
        bossBarInner.style.width = (pct * 100) + "%";
        bossHpLabel.textContent = Math.max(0, Math.round(boss.hp));
      } else {
        bossBarWrap.style.display = "none";
      }
    }

    function showMessage(text, duration = 900) {
      const oldDisplay = bossBarWrap.style.display;
      bossBarWrap.style.display = "block";
      bossLabel.textContent = text;
      bossBarInner.style.width = "100%";
      bossHpLabel.textContent = "";

      if (msgTimeout) clearTimeout(msgTimeout);

      msgTimeout = setTimeout(() => {
        bossBarWrap.style.display = boss ? "block" : "none";
        updateHUD();
      }, duration);
    }

    function resetStars() {
      stars.length = 0;
      for (let i = 0; i < 250; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: 1 + Math.random() * 2.3,
          speed: 0.4 + Math.random() * 1.3,
          alpha: 0.4 + Math.random() * 0.6
        });
      }
    }

    function createPlayer() {
      return {
        x: canvas.width / 2,
        y: canvas.height - 60,
        width: 24,
        height: 34,
        speed: 5.2,
        radius: 18
      };
    }

    function spawnEnemy() {
      const size = 18 + Math.random() * 18;
      enemies.push({
        x: Math.random() * (canvas.width - 80) + 40,
        y: -30,
        size,
        speed: 1.1 + Math.random() * 1.6,
        drift: (Math.random() - 0.5) * 0.8
      });
    }

    function spawnCollectible() {
      collectibles.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: -20,
        radius: 10,
        speed: 1.4 + Math.random() * 1.8,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function shoot() {
      if (!gameRunning || !player) return;
      const now = performance.now();
      if (now - lastShotTime < shotCooldown) return;

      lastShotTime = now;

      bullets.push({
        x: player.x,
        y: player.y - 18,
        radius: 4,
        speed: 8,
        color: "#e0f2fe"
      });
    }

    function enemyShoot(from, speed = 3.5, radius = 5, color = "#ff9d57") {
      const angle = Math.atan2(player.y - from.y, player.x - from.x);
      enemyBullets.push({
        x: from.x,
        y: from.y,
        radius,
        speed,
        color,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed
      });
    }

    function spawnBoss() {
      if (bossSpawned || boss) return;
      bossSpawned = true;

      boss = {
        x: canvas.width / 2,
        y: 110,
        radius: 44,
        hp: 120,
        maxHp: 120,
        dir: 1,
        speed: 2.5,
        lastShot: 0
      };
    }

    function initScene() {
      player = createPlayer();
      enemies.length = 0;
      collectibles.length = 0;
      bullets.length = 0;
      enemyBullets.length = 0;
      boss = null;
      bossSpawned = false;

      score = 0;
      lives = 3;
      lastShotTime = 0;
      lastEnemySpawn = performance.now();
      lastCollectSpawn = performance.now();

      updateHUD();
      resetStars();
    }

    function startGame() {
      initScene();
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function endGame() {
      gameRunning = false;
      showMessage("Juego terminado", 1800);
      setTimeout(() => {
        showMessage(`Puntaje final: ${score}`, 2400);
      }, 500);
    }

    function update(dt) {
      if (!player) return;

      const moveX = (keys["ArrowLeft"] || keys["a"] ? -1 : 0) + (keys["ArrowRight"] || keys["d"] ? 1 : 0);
      const moveY = (keys["ArrowUp"] || keys["w"] ? -1 : 0) + (keys["ArrowDown"] || keys["s"] ? 1 : 0);

      player.x += moveX * player.speed * dt * 0.06;
      player.y += moveY * player.speed * dt * 0.06;

      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(40, Math.min(canvas.height - 30, player.y));

      // Spawns
      const now = performance.now();
      if (now - lastEnemySpawn > 1000 + Math.random() * 500) {
        spawnEnemy();
        lastEnemySpawn = now;
      }

      if (now - lastCollectSpawn > 1400 + Math.random() * 1100) {
        spawnCollectible();
        lastCollectSpawn = now;
      }

      if (!bossSpawned && score >= 300) {
        spawnBoss();
        showMessage("¡Jefe entrante!", 1200);
      }

      // Update stars
      for (const star of stars) {
        star.y += star.speed * dt * 0.06;
        if (star.y > canvas.height) {
          star.y = -5;
          star.x = Math.random() * canvas.width;
        }
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed * dt * 0.06;

        if (b.y < -20) {
          bullets.splice(i, 1);
          continue;
        }

        // Enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          const dx = b.x - e.x;
          const dy = b.y - e.y;
          const dist = Math.hypot(dx, dy);

          if (dist < e.size * 0.7) {
            bullets.splice(i, 1);
            enemies.splice(j, 1);
            score += 15;
            updateHUD();
            break;
          }
        }

        if (i < 0) continue;

        // Boss
        if (boss) {
          const dx = b.x - boss.x;
          const dy = b.y - boss.y;
          const dist = Math.hypot(dx, dy);
          if (dist < boss.radius + 8) {
            bullets.splice(i, 1);
            boss.hp -= 8;
            score += 5;
            updateHUD();

            if (boss.hp <= 0) {
              score += 200;
              updateHUD();
              boss = null;
              bossSpawned = false;
              showMessage("¡Jefe derrotado!", 1500);
            }
          }
        }
      }

      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed * dt * 0.06;
        e.x += e.drift * dt * 0.06;

        if (e.y > canvas.height + 40) {
          enemies.splice(i, 1);
          lives -= 1;
          updateHUD();
          if (lives <= 0) endGame();
          continue;
        }

        if (Math.hypot(e.x - player.x, e.y - player.y) < (e.size * 0.7 + player.radius)) {
          enemies.splice(i, 1);
          lives -= 1;
          updateHUD();
          if (lives <= 0) endGame();
        }
      }

      // Update collectibles
      for (let i = collectibles.length - 1; i >= 0; i--) {
        const c = collectibles[i];
        c.y += c.speed * dt * 0.06;
        c.pulse += dt * 0.008;

        if (c.y > canvas.height + 30) {
          collectibles.splice(i, 1);
          continue;
        }

        if (Math.hypot(c.x - player.x, c.y - player.y) < c.radius + player.radius) {
          collectibles.splice(i, 1);
          score += 10;
          updateHUD();
        }
      }

      // Boss behavior
      if (boss) {
        boss.x += boss.speed * boss.dir * dt * 0.06;
        boss.y = 110 + Math.sin(performance.now() * 0.003) * 18;

        if (boss.x > canvas.width - 80 || boss.x < 80) {
          boss.dir *= -1;
        }

        if (performance.now() - boss.lastShot > 900) {
          boss.lastShot = performance.now();
          enemyShoot({ x: boss.x - 18, y: boss.y + 14 }, 3.2, 5, "#ff6666");
          setTimeout(() => enemyShoot({ x: boss.x + 18, y: boss.y + 14 }, 3.5, 4, "#ff9966"), 100);
        }
      }

      // Enemy bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx * dt * 0.06;
        b.y += b.vy * dt * 0.06;

        if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius + b.radius) {
          enemyBullets.splice(i, 1);
          lives -= 1;
          updateHUD();
          if (lives <= 0) endGame();
          continue;
        }

        if (b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) {
          enemyBullets.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#020617");
      gradient.addColorStop(1, "#0a0f19");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) {
        ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;

      ctx.save();
      ctx.translate(x, y);

      // cuerpo
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(16, 16);
      ctx.lineTo(0, 12);
      ctx.lineTo(-16, 16);
      ctx.closePath();
      ctx.fill();

      // ala
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.beginPath();
      ctx.moveTo(-10, 8);
      ctx.lineTo(0, 20);
      ctx.lineTo(10, 8);
      ctx.closePath();
      ctx.fill();

      // motor
      ctx.fillStyle = "#facc15";
      ctx.fillRect(-4, 18, 8, 8);

      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);

      ctx.fillStyle = "#f87171";
      ctx.fillRect(-e.size * 0.5, -e.size * 0.5, e.size, e.size);

      ctx.fillStyle = "#fecaca";
      ctx.fillRect(-e.size * 0.2, -e.size * 0.3, e.size * 0.4, e.size * 0.4);

      ctx.restore();
    }

    function drawCollectible(c) {
      const pulse = 1 + Math.sin(c.pulse) * 0.18;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(pulse, pulse);

      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-c.radius * 0.6, 0);
      ctx.lineTo(c.radius * 0.6, 0);
      ctx.moveTo(0, -c.radius * 0.6);
      ctx.lineTo(0, c.radius * 0.6);
      ctx.stroke();

      ctx.restore();
    }

    function drawBullet(b) {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBoss() {
      if (!boss) return;

      ctx.save();
      ctx.translate(boss.x, boss.y);

      // cuerpo principal
      ctx.fillStyle = "#7c3aed";
      ctx.beginPath();
      ctx.moveTo(0, -boss.radius);
      ctx.lineTo(boss.radius * 0.9, -12);
      ctx.lineTo(boss.radius, 18);
      ctx.lineTo(0, boss.radius);
      ctx.lineTo(-boss.radius, 18);
      ctx.lineTo(-boss.radius * 0.9, -12);
      ctx.closePath();
      ctx.fill();

      // ojos
      ctx.fillStyle = "#fbbf24";
      ctx.fillRect(-20, -8, 12, 12);
      ctx.fillRect(8, -8, 12, 12);

      // brillo
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillRect(-8, -28, 16, 8);

      ctx.restore();
    }

    function draw() {
      drawBackground();

      for (const b of bullets) drawBullet(b);
      for (const b of enemyBullets) drawBullet(b);
      for (const e of enemies) drawEnemy(e);
      for (const c of collectibles) drawCollectible(c);
      if (boss) drawBoss();
      if (player) drawPlayer();
    }

    function loop(now) {
      if (!gameRunning) return;

      const delta = now - lastTime || 16;
      lastTime = now;

      update(delta);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (ev) => {
      const key = ev.key;
      keys[key] = true;
      keys[key.toLowerCase()] = true;

      if (ev.code === "Space") {
        ev.preventDefault();
        shoot();
      }
    });

    document.addEventListener("keyup", (ev) => {
      const key = ev.key;
      keys[key] = false;
      keys[key.toLowerCase()] = false;
    });

    canvas.addEventListener("click", () => {
      shoot();
      canvas.focus();
    });

    startBtn.addEventListener("click", () => {
      startGame();
      canvas.focus();
    });

    window.addEventListener("resize", () => {
      resizeCanvas();
      resetStars();
      if (player) {
        player.x = Math.min(player.x, canvas.width - 20);
        player.y = Math.min(player.y, canvas.height - 20);
      }
    });

    resizeCanvas();
    initScene();
    updateHUD();
    draw();
    canvas.focus();
  </script>
</body>
</html>
